name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  asan-ubsan:
    name: Tests under ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Slow integration tests (timeouts and slowloris)
        run: python3 tests/integration_test.py build/httpserver --slow

  tsan:
    name: Tests under ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzz the parser for 60 seconds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build the fuzzer
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DENABLE_SANITIZERS=OFF -DBUILD_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target fuzz_parser -j
      - name: Run the fuzzer
        run: |
          mkdir -p corpus-work
          ./build/fuzz_parser corpus-work tests/corpus -max_total_time=60
